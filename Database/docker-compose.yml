services:
  LunariumBot.NET.DB:
    image: postgres:17-bookworm # 镜像版本和标签
    container_name: LunariumBot.NET.DB # 容器名字
    shm_size: 512mb
    restart: always              # 保证 Docker 重启或服务器重启后容器会自动启动
    command: -c config_file=/etc/postgresql/postgresql-custom.conf
    environment:
      # --- 基础配置 ---
      POSTGRES_USER: 'LunariumBot.NET'              # 数据库用户名
      POSTGRES_PASSWORD: 'sk-LunariumDb-F7spNBPTjjH73NpjDBQfBb2G-mIasTHF'  # 数据库密码
      POSTGRES_DB: 'LunariumBot.NET.DB'                 # 数据库名

      # --- 语言与区域设置 ---
      TZ: "Asia/Shanghai"                       # 设置容器时区为东八区
      PGTZ: "Asia/Shanghai"                     # 设置 PostgreSQL 内部时区
    ports:
      - "0.0.0.0:52001:5432"  # 将容器的 52001 端口映射到主机的 5432 端口

    volumes:
      # 数据目录 - 绑定到宿主机
      - /opt/docker-data/postgres-LunariumBot.NET.DB:/var/lib/postgresql/data
      # 备份目录 - 方便从容器内备份
      - /opt/backups/postgres-LunariumBot.NET.DB:/backups
      # 使用相对路径（相对于 docker-compose.yml 文件）
      - ./postgresql-custom.conf:/etc/postgresql/postgresql-custom.conf
      # 将宿主机的 server.crt 挂载到容器内
      - ./pg-ssl-certs/server.crt:/var/lib/postgresql/data/server.crt
      # 将宿主机的 server.key 挂载到容器内
      - ./pg-ssl-certs/server.key:/var/lib/postgresql/data/server.key

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U LunariumBot.NET -d LunariumBot.NET.DB"] # 健康检查
      interval: 10s
      timeout: 5s
      retries: 30