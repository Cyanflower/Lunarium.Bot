name: Discord Notify

# Actions 只发 Release 通知；push / PR / issue 由 Discord 原生 GitHub webhook 发送。
# Webhook URL 存放在 Settings → Secrets and variables → Actions → DISCORD_WEBHOOK_URL
on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  discord:
    name: Send Discord notification
    runs-on: ubuntu-latest
    timeout-minutes: 5

    # fork PR 拿不到 secrets；同时避免用不可信 PR 的内容触发仓库级通知
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Send
        shell: bash
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          if [ -z "${DISCORD_WEBHOOK_URL:-}" ]; then
            echo "DISCORD_WEBHOOK_URL 未配置，跳过通知"
            echo "请在 Settings → Secrets and variables → Actions 中创建该 Secret"
            exit 0
          fi

          event="$GITHUB_EVENT_PATH"

          case "$EVENT_NAME" in
            release)
              payload=$(jq '{
                username: "Lunarium CI",
                allowed_mentions: { parse: [] },
                embeds: [{
                  title: (
                    ("Release " + .release.tag_name
                     + (if .release.prerelease then " (pre-release)" else "" end))[0:250]
                  ),
                  url: .release.html_url,
                  description: (
                    (.release.body // "") as $body
                    | if $body == "" then "（无 Release 说明）" else $body[0:3900] end
                  ),
                  color: (if .release.prerelease then 16776960 else 5763719 end),
                  author: {
                    name: .release.author.login,
                    icon_url: .release.author.avatar_url
                  },
                  fields: [
                    { name: "标签", value: .release.tag_name, inline: true }
                  ],
                  timestamp: (.release.published_at // .release.created_at)
                }]
              }' "$event")
              ;;

            workflow_dispatch)
              payload=$(jq -n \
                --arg repo "$GITHUB_REPOSITORY" \
                --arg run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
                '{
                  username: "Lunarium CI",
                  content: ("Discord 通知连通性测试 — " + $repo + "\n" + $run)
                }')
              ;;

            *)
              echo "未处理的事件: $EVENT_NAME，跳过通知"
              exit 0
              ;;
          esac

          curl --fail-with-body --silent --show-error \
            --retry 3 --retry-delay 2 --max-time 20 \
            -X POST "${DISCORD_WEBHOOK_URL}?wait=true" \
            -H "Content-Type: application/json" \
            -H "User-Agent: Lunarium.Bot-CI" \
            --data-binary "$payload"
